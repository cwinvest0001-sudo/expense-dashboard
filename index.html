<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Dashboard</title>
<style>
  :root{
    --bg:#FAFAF7; --card:#FFFFFF; --ink:#1C2530; --ink-soft:#5D6873; --ink-faint:#8A939B;
    --line:#E7E7DF; --grid:#F0F0EA; --bar:#B9C0C0; --bar-soft:#EEF0EC;
    --accent:#B4553A;              /* the ONE accent: wrong-direction signals only */
    --accent-soft:#F6E9E4;
    --info:#5A6B7D;                /* neutral slate: data-quality notes (not good, not bad) */
    --good:#2E7D57;                /* used ONLY on the month-over-month tile when spend falls */
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
  .wrap{max-width:900px;margin:0 auto;padding:36px 24px 80px;}

  header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:30px;}
  header.top h1{font-size:23px;margin:0;font-weight:700;letter-spacing:-.01em;}
  header.top p{margin:4px 0 0;color:var(--ink-soft);font-size:14.5px;}
  .freshness{margin-top:11px;display:inline-block;font-size:12px;color:var(--ink-soft);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;letter-spacing:.02em;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{background:var(--card);color:var(--ink);border:1.5px solid var(--line);
    padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn:hover{border-color:var(--ink);}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn.primary:hover{background:#2c3a48;}

  /* Verdict strip */
  .verdict{display:grid;grid-template-columns:1.15fr 1fr 1.25fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .vcell{background:var(--card);padding:22px 24px;}
  .vlabel{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-soft);margin-bottom:10px;}
  .vbig{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;}
  .vsub{font-size:13px;color:var(--ink-soft);margin-top:8px;}
  .vcell.bad{background:#FBF0EB;box-shadow:inset 4px 0 0 var(--accent);}
  .vcell.good{background:#EDF6F0;box-shadow:inset 4px 0 0 var(--good);}
  .vchange{font-size:28px;font-weight:700;line-height:1;display:flex;align-items:center;gap:10px;}
  .vchange .ico{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
    font-size:14px;color:#fff;background:var(--ink-faint);flex:none;}
  .bad .vchange{color:var(--accent);} .bad .ico{background:var(--accent);}
  .good .vchange{color:var(--good);} .good .ico{background:var(--good);}
  .verdict-word{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700;letter-spacing:.03em;
    padding:3px 10px;border-radius:999px;background:#EEF0EC;color:var(--ink-soft);}
  .bad .verdict-word{background:var(--accent);color:#fff;}
  .good .verdict-word{background:var(--good);color:#fff;}
  .vfast{font-size:23px;font-weight:700;line-height:1.15;}
  .warn{color:var(--accent);}
  .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent);
    background:var(--accent-soft);border-radius:999px;padding:2px 9px;margin-top:9px;}

  section{margin-top:40px;}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .sec-h h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;margin:0;}
  .hint{font-size:12.5px;color:var(--ink-soft);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;}
  svg{display:block;width:100%;height:auto;overflow:visible;}

  /* Legend */
  .legend{display:flex;gap:18px;font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;flex-wrap:wrap;}
  .legend i{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:7px;border-top:3.2px solid var(--ink);border-radius:2px;}
  .legend i.ov,.legend i.ovq{width:14px;height:12px;border:none;border-top:2.4px solid var(--accent);background:rgba(180,85,58,.22);border-radius:2px;}
  .legend i.ovq{border-top-color:#7F8A93;background:rgba(127,138,147,.22);}

  /* Tooltip */
  .chart-box{position:relative;}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;line-height:1.5;
    padding:7px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;}
  .tip b{font-weight:700;}

  /* Bars */
  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .toggle button{background:var(--card);border:none;padding:5px 12px;font-size:12px;font-weight:600;
    color:var(--ink-soft);cursor:pointer;font-family:inherit;}
  .toggle button.on{background:var(--ink);color:#fff;}
  .bars{display:flex;flex-direction:column;gap:14px;}
  .bar-row{display:grid;grid-template-columns:150px 1fr 170px;align-items:center;gap:14px;}
  .bar-label{font-size:13.5px;font-weight:600;}
  .bar-track{background:var(--bar-soft);border-radius:6px;height:20px;overflow:hidden;}
  .bar-fill{background:var(--bar);height:100%;border-radius:6px;}
  .bar-fill.hot{background:var(--accent);opacity:.85;}
  .bar-val{font-size:13.5px;white-space:nowrap;}
  .flag{color:var(--accent);font-weight:700;font-size:12px;margin-left:8px;}
  .tag{color:var(--ink-soft);font-weight:600;font-size:11px;margin-left:8px;background:var(--bar-soft);border-radius:5px;padding:1px 6px;}
  .chg{color:var(--ink-faint);font-size:12px;margin-left:8px;}

  /* Table */
  .controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .controls label{font-size:12px;color:var(--ink-soft);margin-right:6px;}
  select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
  .tscroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);
    font-weight:600;padding:0 10px 9px 0;border-bottom:1px solid var(--line);white-space:nowrap;}
  th.r,td.r{text-align:right;padding-right:0;}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--ink);}
  .caret{font-size:9px;margin-left:4px;}
  td{padding:9px 10px 9px 0;border-bottom:1px solid var(--grid);vertical-align:top;}
  td.v{font-weight:600;}
  td.note{color:var(--ink-soft);font-size:12.5px;}
  tfoot td{border-top:1.5px solid var(--ink);border-bottom:none;padding-top:11px;font-weight:700;}
  .muted{color:var(--ink-soft);}

  /* Data notes (neutral, never alarming) */
  .dq{margin-top:18px;background:#F3F5F7;border:1px solid #E1E6EB;border-radius:12px;padding:15px 20px;font-size:13.5px;color:var(--ink);}
  .dq-h{display:flex;gap:10px;align-items:flex-start;}
  .ibadge{flex:none;display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;
    background:var(--info);color:#fff;font:700 11.5px Georgia,serif;font-style:italic;margin-top:1px;}
  .dq ul{margin:10px 0 2px 29px;padding:0;list-style:none;}
  .dq li{padding:6px 0;border-top:1px solid #E1E6EB;color:var(--ink-soft);line-height:1.5;}
  .dq li b{color:var(--ink);}
  .dq.ok{color:var(--ink-soft);}
  .linkbtn{background:none;border:none;padding:0;margin-left:6px;font:inherit;font-size:12.5px;font-weight:600;color:var(--info);
    text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap;}
  .vnote{margin-top:9px;font-size:12px;color:var(--info);line-height:1.45;}
  .dtag{display:inline-block;margin:3px 4px 0 0;font-size:10.5px;font-weight:600;color:var(--info);
    border:1px solid #C9D2DB;border-radius:5px;padding:0 5px;white-space:nowrap;}
  tr.flagged td{background:#F8F9FA;}
  .legend i.dn{width:8px;height:8px;border:none;border-radius:50%;background:var(--info);}
  .legend i.adj{width:9px;height:9px;border:1.8px solid var(--ink);background:var(--card);border-radius:50%;}
  details.aside{margin-top:30px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-size:13px;}
  details.aside summary{cursor:pointer;color:var(--ink-soft);font-weight:600;}
  details.aside ul{margin:10px 0 4px;padding-left:18px;color:var(--ink-soft);}
  .fresh-line{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);}
  .fresh-line b{color:var(--ink);}
  .foot{margin-top:8px;font-size:12px;color:var(--ink-soft);line-height:1.7;}
  .swatch{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--accent);vertical-align:middle;margin:0 3px 2px;}
  .err{color:var(--accent);}
  input[type=file]{display:none;}

  @media (max-width:680px){
    .verdict{grid-template-columns:1fr;} .vbig{font-size:30px;}
    .bar-row{grid-template-columns:110px 1fr;} .bar-val{grid-column:2;margin-top:-8px;}
    .wrap{padding:24px 16px 60px;}
  }
  @media print{
    body{background:#fff;} .toolbar,.toggle{display:none;}
    .card,.verdict,.vcell{border-color:#ccc;} section{break-inside:avoid;}
  }
</style>
</head>

<script>
/* ======================= settings ======================= */
const FLAG_PCT = 50;   // a category up more than this % vs prior month gets flagged
const KNOWN=["Software","Office Rent","Meals & Entertainment","Travel","Office Supplies","Marketing"];

/* ======================= parsing (hardened) ======================= */
const MONTHS3={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseCSV(text){
  const clean=text.replace(/^﻿/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const lines=clean.split("\n").filter(l=>l.trim()!=="");
  const pl=l=>{const o=[];let c="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];
    if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}
    else{if(ch==='"')q=true;else if(ch===','){o.push(c);c="";}else c+=ch;}}o.push(c);return o;};
  if(!lines.length)return{headers:[],rows:[]};
  const headers=pl(lines[0]).map(h=>h.trim());const rows=[];
  for(let i=1;i<lines.length;i++){const v=pl(lines[i]);const ob={__line:i+1};
    headers.forEach((h,idx)=>ob[h]=(v[idx]!==undefined?v[idx]:"").trim());rows.push(ob);}
  return{headers,rows};
}
function findCol(h,n){for(const x of n){const hit=h.find(k=>k.toLowerCase()===x);if(hit)return hit;}return null;}
function valid(y,mo,da){if(mo<1||mo>12||da<1||da>31||y<1900||y>2100)return null;
  return{key:y+"-"+String(mo).padStart(2,"0"),iso:y+"-"+String(mo).padStart(2,"0")+"-"+String(da).padStart(2,"0")};}
function parseDate(d){d=(d||"").trim();if(!d)return null;let m;
  if(m=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))return valid(+m[1],+m[2],+m[3]);
  if(m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))return valid(+m[3],+m[1],+m[2]);
  if(m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/))return valid(2000+ +m[3],+m[1],+m[2]);
  if(m=d.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})$/)){const mo=MONTHS3[m[1].slice(0,3).toLowerCase()];return mo?valid(+m[3],mo,+m[2]):null;}
  if(m=d.match(/^(\d{1,2})\s+([A-Za-z]{3,9})\.?\s+(\d{4})$/)){const mo=MONTHS3[m[2].slice(0,3).toLowerCase()];return mo?valid(+m[3],mo,+m[1]):null;}
  return null;}
function parseAmount(raw){let s=(raw||"").trim();if(!s)return{status:"blank"};let neg=false;
  s=s.replace(/\$/g,"").replace(/\s/g,"");if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  s=s.replace(/,/g,"");if(s.startsWith("-")){neg=true;s=s.slice(1);}if(s.startsWith("+"))s=s.slice(1);
  if(!/^\d+(\.\d+)?$/.test(s))return{status:"unreadable"};const v=parseFloat(s);
  return isNaN(v)?{status:"unreadable"}:{status:"ok",value:neg?-v:v};}
function canonCat(c){const t=(c||"").trim();return KNOWN.find(k=>k.toLowerCase()===t.toLowerCase())||t||"(no category)";}
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const monthName=k=>{const[y,mo]=k.split("-");return MN[+mo-1]+" "+y;};
const monthOnly=k=>MN[+k.split("-")[1]-1];
const monthShort=k=>MN[+k.split("-")[1]-1].slice(0,3);

/* ======================= analysis ======================= */
function analyze(text){
  const {headers,rows}=parseCSV(text);
  const cD=findCol(headers,["date"]),cV=findCol(headers,["vendor","payee","merchant"]),
        cC=findCol(headers,["category"]),cA=findCol(headers,["amount","amt","total","cost"]),
        cN=findCol(headers,["notes","note","memo","description"]);
  if(!cD||!cV||!cC||!cA) return {error:"This file needs Date, Vendor, Category and Amount columns. Columns found: "+(headers.join(", ")||"none")+"."};
  const recs=[], aside=[];
  rows.forEach(r=>{
    const dt=parseDate(r[cD]);
    if(!dt){aside.push({line:r.__line,why:"date “"+(r[cD]||"blank")+"” couldn’t be read — row skipped",txt:[r[cV],r[cA]].filter(Boolean).join(", ")});return;}
    const a=parseAmount(r[cA]);
    if(a.status!=="ok") aside.push({line:r.__line,why:"amount is "+(a.status==="blank"?"blank":"“"+r[cA]+"”")+" — shown in the table but not counted",txt:r[cD]+", "+r[cV]});
    if(!KNOWN.includes(canonCat(r[cC]))) aside.push({line:r.__line,why:"unrecognized category “"+canonCat(r[cC])+"” — counted as its own category",txt:r[cD]+", "+r[cV]});
    recs.push({date:dt.iso,month:dt.key,vendor:r[cV],category:canonCat(r[cC]),amount:a.status==="ok"?a.value:null,notes:cN?r[cN]:""});
  });
  const months=[...new Set(recs.map(r=>r.month))].sort();
  if(!months.length) return {error:"No rows had a readable date, so there’s nothing to chart."};
  const catsIn=k=>{const m={};recs.forEach(r=>{if(r.month===k&&r.amount!==null)m[r.category]=(m[r.category]||0)+r.amount;});return m;};
  const byMonth=months.map(k=>({key:k,cats:catsIn(k)}));
  const totals=byMonth.map(m=>({key:m.key,total:Object.values(m.cats).reduce((a,b)=>a+b,0)}));
  const cur=byMonth[byMonth.length-1], prev=byMonth.length>1?byMonth[byMonth.length-2]:null;
  const totalThis=totals[totals.length-1].total, totalPrev=prev?totals[totals.length-2].total:null;
  const diff=prev?totalThis-totalPrev:null, pct=prev&&totalPrev?diff/totalPrev*100:null;

  let fastest=null;
  if(prev) Object.keys(cur.cats).forEach(c=>{const p=prev.cats[c]||0;if(p>0){const g=(cur.cats[c]-p)/p*100;
    if(g>0&&(!fastest||g>fastest.pct))fastest={cat:c,pct:g,now:cur.cats[c],was:p};}});
  if(fastest){fastest.flag=fastest.pct>FLAG_PCT;fastest.series=byMonth.map(m=>({key:m.key,total:m.cats[fastest.cat]||0}));}

  const catThis=Object.keys(cur.cats).map(c=>{const p=prev?(prev.cats[c]||0):0,now=cur.cats[c];
    const pc=p>0?(now-p)/p*100:null;return{cat:c,total:now,pct:pc,isNew:!!prev&&p===0,flag:pc!==null&&pc>FLAG_PCT};})
    .sort((a,b)=>b.total-a.total);
  const all={};recs.forEach(r=>{if(r.amount!==null)all[r.category]=(all[r.category]||0)+r.amount;});
  const catAll=Object.keys(all).map(c=>({cat:c,total:all[c]})).sort((a,b)=>b.total-a.total);

  /* ---- data-quality checks: anything that should lower a viewer's confidence ---- */
  recs.forEach((r,i)=>{r.id=i;r.flags=[];});
  const issues=[], mNotes={}, dupByMonth={}, addNote=(k,s)=>{(mNotes[k]=mNotes[k]||[]).push(s);};
  const plural=(n,w)=>n+" "+w+(n===1?"":"s");
  const listMonths=ks=>[...new Set(ks)].sort().map(monthOnly).join(", ");
  // 1) missing amounts
  const noAmt=recs.filter(r=>r.amount===null);
  noAmt.forEach(r=>{r.flags.push("No amount");addNote(r.month,"1 expense with no amount (not counted)");});
  if(noAmt.length) issues.push({tag:"No amount",title:plural(noAmt.length,"expense")+" with no amount",
    text:`${noAmt.map(r=>r.vendor+" on "+r.date).join("; ")}. Not counted, so ${listMonths(noAmt.map(r=>r.month))} ${new Set(noAmt.map(r=>r.month)).size>1?"totals are":"total is"} understated by an unknown amount.`});
  // 2) possible duplicates: same vendor, same month, same amount (within 50 cents)
  const grp={};recs.forEach(r=>{if(r.amount!==null){const k=r.month+"|"+r.vendor.toLowerCase();(grp[k]=grp[k]||[]).push(r);}});
  const clusters=[];
  Object.values(grp).forEach(g=>{g.sort((a,b)=>a.amount-b.amount);let cur=[g[0]];
    for(let i=1;i<g.length;i++){if(Math.abs(g[i].amount-cur[cur.length-1].amount)<=0.5)cur.push(g[i]);else{if(cur.length>1)clusters.push(cur);cur=[g[i]];}}
    if(cur.length>1)clusters.push(cur);});
  let dupExtra=0, biggest=null;
  clusters.forEach(c=>{const extra=c.reduce((s,r)=>s+r.amount,0)-Math.max(...c.map(r=>r.amount));dupExtra+=extra;
    const m=c[0].month;dupByMonth[m]=(dupByMonth[m]||0)+extra;
    const sameDay=c.every(r=>r.date===c[0].date);
    c.forEach(r=>r.flags.push(sameDay?"Likely duplicate":"Possible duplicate"));
    if(!biggest||extra>biggest.extra)biggest={extra,c,sameDay};});
  Object.keys(dupByMonth).forEach(m=>addNote(m,"possible duplicates: "+money(dupByMonth[m])+" extra"));
  if(clusters.length){const b=biggest.c[0];
    issues.push({tag:"dup",title:plural(clusters.length,"possible duplicate charge"),
      text:`Same vendor and amount more than once in a month. They are <b>counted</b> in the totals; if they are duplicates, spending is overstated by <b class="num">${money(dupExtra)}</b>. Biggest: ${esc(b.vendor)} ${money(b.amount)} ${biggest.c.length}&times; ${biggest.sameDay?"on "+b.date:"in "+monthName(b.month)}.`});}
  // 3) open questions written in the notes
  const OPEN=/\?|needs|check w|missing|verify|confirm|tbd|dispute/i;
  const openQ=recs.filter(r=>r.notes&&OPEN.test(r.notes));
  openQ.forEach(r=>r.flags.push("Open question"));
  if(openQ.length){const amt=openQ.reduce((s,r)=>s+(r.amount||0),0);
    const ex=[...new Set(openQ.map(r=>"\u201c"+r.notes+"\u201d"))].slice(0,3).join(", ");
    issues.push({tag:"Open question",title:plural(openQ.length,"expense")+" with unresolved notes",
      text:`<b class="num">${money(amt)}</b> of spending carries notes like ${esc(ex)}. If any of it was reimbursed or rejected, the totals are overstated.`});}
  // 4) months that look incomplete
  const counts=months.map(k=>recs.filter(r=>r.month===k).length), sorted=counts.slice().sort((a,b)=>a-b), med=sorted[Math.floor(sorted.length/2)];
  months.forEach((k,i)=>{if(months.length>=3&&counts[i]<0.6*med){addNote(k,"only "+counts[i]+" expenses (usually ~"+med+")");
    issues.push({tag:null,title:monthName(k)+" looks thin",text:`Only ${counts[i]} expenses recorded, versus about ${med} in a typical month. Some expenses may be missing.`});}});
  const curK=months[months.length-1], lastDay=+recs.filter(r=>r.month===curK).map(r=>r.date).sort().pop().slice(8,10);
  const curNote=[];
  if(lastDay<20){addNote(curK,"latest expense is on day "+lastDay);curNote.push("month may not be complete");
    issues.push({tag:null,title:monthName(curK)+" may not be finished",text:`The latest expense is dated ${monthOnly(curK)} ${lastDay}. If the month isn\u2019t over, its total and the change vs ${months.length>1?monthOnly(months[months.length-2]):"last month"} will look lower than they really are.`});}
  const prior=months.slice(0,-1);
  if(prior.length>=3){
    const vIn=v=>prior.filter(k=>recs.some(r=>r.month===k&&r.vendor===v));
    const missing=[...new Set(recs.map(r=>r.vendor))].filter(v=>vIn(v).length>=Math.max(3,Math.ceil(prior.length*0.75))&&!recs.some(r=>r.month===curK&&r.vendor===v))
      .map(v=>{const per=vIn(v).map(k=>recs.filter(r=>r.month===k&&r.vendor===v).reduce((s,r)=>s+(r.amount||0),0)).sort((a,b)=>a-b);return{v,typ:per[Math.floor(per.length/2)]};});
    if(missing.length){const est=missing.reduce((s,m)=>s+m.typ,0);
      addNote(curK,"regular vendor(s) not recorded: "+missing.map(m=>m.v).join(", "));
      curNote.push(missing.map(m=>m.v).join(", ")+" not recorded");
      issues.push({tag:null,title:"Regular "+(missing.length===1?"vendor":"vendors")+" missing from "+monthOnly(curK),
        text:`${missing.map(m=>`<b>${esc(m.v)}</b> (usually ~${money0(m.typ)})`).join(", ")} appeared in most earlier months but not in ${monthName(curK)}. If it\u2019s just not recorded yet, ${monthOnly(curK)} is understated by about <b class="num">${money0(est)}</b>.`});}
  }
  // 5) rows skipped / odd categories
  const skipped=aside.filter(a=>/skipped/.test(a.why)), oddCat=aside.filter(a=>/unrecognized/.test(a.why));
  if(skipped.length) issues.push({tag:null,title:plural(skipped.length,"row")+" skipped",text:"Their date couldn\u2019t be read, so they aren\u2019t in any chart or total: "+skipped.map(a=>"line "+a.line+(a.txt?" ("+esc(a.txt)+")":"")).join("; ")+"."});
  if(oddCat.length) issues.push({tag:null,title:plural(oddCat.length,"row")+" with an unfamiliar category",text:"Counted as separate categories: "+oddCat.map(a=>"line "+a.line+" \u2014 "+esc(a.why.match(/\u201c(.*)\u201d/)[1])).join("; ")+"."});
  const dq={issues,mNotes,dupByMonth,curNote,noAmtMonths:new Set(noAmt.map(r=>r.month))};

  return {dq,months,totals,curKey:cur.key,prevKey:prev?prev.key:null,totalThis,totalPrev,diff,pct,fastest,
    catThis,catAll,expenses:recs,aside,meta:{rows:rows.length,counted:recs.filter(r=>r.amount!==null).length,lastDate:recs.map(r=>r.date).sort().pop()}};
}

/* ======================= formatting ======================= */
const money=n=>(n<0?"−":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>(n<0?"−":"")+"$"+Math.round(Math.abs(n)).toLocaleString("en-US");
const kfmt=n=>n>=1000?"$"+(n/1000).toFixed(n%1000===0?0:1)+"k":"$"+Math.round(n);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ======================= charts ======================= */
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function lineChart(d){
  const W=740,H=272,P={l:42,r:120,t:18,b:42},pw=W-P.l-P.r,ph=H-P.t-P.b,n=d.totals.length;
  const max=niceMax(Math.max(1,...d.totals.map(m=>m.total)));
  const X=i=>n===1?P.l+pw/2:P.l+i*(pw/(n-1)), Y=v=>P.t+ph-(v/max)*ph;
  const hot=!!(d.fastest&&d.fastest.flag), ovCol=hot?"var(--accent)":"#7F8A93", ovFill=hot?"rgba(180,85,58,.20)":"rgba(127,138,147,.20)";
  let s="";
  [0,max/2,max].forEach(v=>{
    s+=`<line x1="${P.l}" y1="${Y(v)}" x2="${P.l+pw}" y2="${Y(v)}" stroke="${v===0?"var(--line)":"var(--grid)"}"/>`;
    s+=`<text x="${P.l-8}" y="${Y(v)+3.5}" text-anchor="end" font-size="10.5" fill="var(--ink-faint)">${kfmt(v)}</text>`;
  });
  d.totals.forEach((m,i)=>{s+=`<text x="${X(i)}" y="${H-20}" text-anchor="middle" font-size="11" fill="var(--ink-soft)">${monthShort(m.key)}</text>`;
    if(d.dq.mNotes[m.key])s+=`<circle cx="${X(i)}" cy="${H-6}" r="3.4" fill="var(--info)"/>`;});
  let lastOvY=null;
  if(d.fastest){
    const fs=d.fastest.series;
    // category = shaded area sitting on the baseline ("this slice of the total")
    s+=`<path d="M${X(0)} ${Y(0)} ${fs.map((m,i)=>`L${X(i)} ${Y(m.total)}`).join(" ")} L${X(n-1)} ${Y(0)}Z" fill="${ovFill}"/>`;
    s+=`<polyline points="${fs.map((m,i)=>X(i)+","+Y(m.total)).join(" ")}" fill="none" stroke="${ovCol}" stroke-width="2" stroke-linejoin="round"/>`;
    s+=`<circle cx="${X(n-1)}" cy="${Y(fs[n-1].total)}" r="4" fill="${ovCol}"/>`;
    lastOvY=Y(fs[n-1].total);
  }
  s+=`<polyline points="${d.totals.map((m,i)=>X(i)+","+Y(m.total)).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  d.totals.forEach((m,i)=>s+=`<circle cx="${X(i)}" cy="${Y(m.total)}" r="${i===n-1?5.5:4}" fill="var(--ink)" stroke="var(--card)" stroke-width="2"/>`);
  // hollow ring = what the total would be without possible duplicates (only if it moves the point noticeably)
  d.totals.forEach((m,i)=>{const x=d.dq.dupByMonth[m.key]||0;if(x>=0.03*m.total){
    s+=`<line x1="${X(i)}" y1="${Y(m.total)+6}" x2="${X(i)}" y2="${Y(m.total-x)-5}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="2 3"/>`;
    s+=`<circle cx="${X(i)}" cy="${Y(m.total-x)}" r="4.5" fill="var(--card)" stroke="var(--ink)" stroke-width="1.8"/>`;}});
  // end labels (nudged apart if they collide)
  let tY=Y(d.totals[n-1].total), oY=lastOvY;
  if(oY!==null&&Math.abs(tY-oY)<28){const mid=(tY+oY)/2;if(tY<=oY){tY=mid-14;oY=mid+14;}else{tY=mid+14;oY=mid-14;}}
  s+=`<text x="${X(n-1)+12}" y="${tY-1}" font-size="12" font-weight="700" fill="var(--ink)">Total spend</text>`;
  s+=`<text x="${X(n-1)+12}" y="${tY+13}" font-size="11" fill="var(--ink-soft)" class="num">${money0(d.totals[n-1].total)}</text>`;
  if(oY!==null){
    s+=`<text x="${X(n-1)+12}" y="${oY-1}" font-size="12" font-weight="700" fill="${ovCol}">${esc(d.fastest.cat)} only</text>`;
    s+=`<text x="${X(n-1)+12}" y="${oY+13}" font-size="11" fill="${ovCol}" class="num">${money0(d.fastest.series[n-1].total)}</text>`;
  }
  // hover zones
  const band=n===1?pw:pw/(n-1);
  d.totals.forEach((m,i)=>s+=`<rect class="hz" data-i="${i}" x="${X(i)-band/2}" y="${P.t}" width="${band}" height="${ph}" fill="transparent"/>`);
  s+=`<line id="hline" pointer-events="none" x1="0" x2="0" y1="${P.t}" y2="${P.t+ph}" stroke="var(--line)" stroke-width="1" opacity="0"/>`;
  return {svg:`<svg id="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly spend trend">${s}</svg>`,X,Y,W};
}
function barChart(list,mode){
  const max=Math.max(1,...list.map(x=>x.total));
  return '<div class="bars">'+list.map(x=>{
    let mark="";
    if(mode==="this"){
      if(x.flag) mark=`<span class="flag">&#9650; +${x.pct.toFixed(0)}%</span>`;
      else if(x.isNew) mark='<span class="tag">new</span>';
      else if(x.pct!==null) mark=`<span class="chg">${x.pct>=0?"+":"−"}${Math.abs(x.pct).toFixed(0)}%</span>`;
    }
    return `<div class="bar-row"><div class="bar-label">${esc(x.cat)}</div>
      <div class="bar-track"><div class="bar-fill${mode==="this"&&x.flag?" hot":""}" style="width:${Math.max(.8,x.total/max*100)}%"></div></div>
      <div class="bar-val"><span class="num">${money0(x.total)}</span>${mark}</div></div>`;
  }).join("")+'</div>';
}

/* ======================= render ======================= */
let D=null, barMode="this", sortKey="amount", sortDir="desc", fCat="all", fMonth="all", fFlag="all";

const IB='<span class="ibadge" style="width:15px;height:15px;font-size:10px;margin-right:5px;vertical-align:-2px">i</span>';
function curTotNote(d){const n=[],q=d.dq,k=d.curKey;
  if(q.dupByMonth[k])n.push("includes "+money(q.dupByMonth[k])+" in possible duplicates");
  if(q.noAmtMonths.has(k))n.push("an expense has no amount");
  n.push(...q.curNote);
  return n.length?`<div class="vnote">${IB}${esc(n.join("; "))}</div>`:"";}
function changeNote(d){const q=d.dq;if(!d.prevKey)return"";const n=[];
  const dc=q.dupByMonth[d.curKey]||0, dp=q.dupByMonth[d.prevKey]||0;
  if(dc||dp){const a=d.totalThis-dc,b=d.totalPrev-dp;if(b>0){const pc=(a-b)/b*100;n.push("Without possible duplicates: "+(pc>=0?"+":"\u2212")+Math.abs(pc).toFixed(0)+"%");}}
  if(q.noAmtMonths.has(d.prevKey))n.push(monthOnly(d.prevKey)+" has an expense with no amount");
  return n.length?`<div class="vnote">${IB}${esc(n.join(" \u00b7 "))}</div>`:"";}
function verdict(d){
  const total=`<div class="vcell"><div class="vlabel">Total spend &middot; ${monthName(d.curKey)}</div>
    <div class="vbig num">${money(d.totalThis)}</div><div class="vsub">latest month in the file</div>${curTotNote(d)}</div>`;
  let change=`<div class="vcell"><div class="vlabel">Change vs prior month</div><div class="vbig">&mdash;</div><div class="vsub">only one month of data</div></div>`;
  if(d.prevKey){
    const up=d.diff>0.005, down=d.diff<-0.005, cls=up?"bad":down?"good":"flat", pm=monthOnly(d.prevKey);
    const word=up?"Worse &mdash; spending rose":down?"Better &mdash; spending fell":"No change";
    change=`<div class="vcell ${cls}"><div class="vlabel">Change vs ${pm}</div>
      <div class="vchange"><span class="ico">${up?"&#9650;":down?"&#9660;":"&#8211;"}</span>${up?"Up":down?"Down":"Flat"} <span class="num">${d.pct===null?"":Math.abs(d.pct).toFixed(0)+"%"}</span></div>
      <span class="verdict-word">${word}</span>
      <div class="vsub num">${up?"+":down?"&minus;":""}${money(Math.abs(d.diff))} vs ${money(d.totalPrev)} in ${pm}</div>${changeNote(d)}</div>`;
  }
  let fast=`<div class="vcell"><div class="vlabel">Fastest-growing category</div><div class="vfast">&mdash;</div><div class="vsub">no category grew vs last month</div></div>`;
  if(d.fastest){const f=d.fastest;
    fast=`<div class="vcell"><div class="vlabel">Fastest-growing category</div>
      <div class="vfast">${esc(f.cat)} <span class="num ${f.flag?"warn":""}">+${f.pct.toFixed(0)}%</span></div>
      <div class="vsub num">${money0(f.was)} &rarr; ${money0(f.now)}</div>
      ${f.flag?'<span class="pill">Unusually fast</span>':''}</div>`;}
  return `<div class="verdict">${total}${change}${fast}</div>`;
}

function table(d){
  const cats=["all",...[...new Set(d.expenses.map(e=>e.category))].sort()], mons=["all",...d.months.slice().reverse()];
  const opt=(v,sel,label)=>`<option value="${esc(v)}"${v===sel?" selected":""}>${label}</option>`;
  const flagMatch=e=>fFlag==="all"||(fFlag==="any"?e.flags.length>0:fFlag==="dup"?e.flags.some(f=>/duplicate/.test(f)):e.flags.includes(fFlag));
  let rows=d.expenses.filter(e=>(fCat==="all"||e.category===fCat)&&(fMonth==="all"||e.month===fMonth)&&flagMatch(e));
  const nFlag=d.expenses.filter(e=>e.flags.length).length;
  rows=rows.slice().sort((a,b)=>{
    let r;
    if(sortKey==="amount"){const av=a.amount??-Infinity,bv=b.amount??-Infinity;r=av-bv;}
    else r=a.date<b.date?-1:a.date>b.date?1:0;
    return sortDir==="desc"?-r:r;
  });
  const sum=rows.reduce((s,e)=>s+(e.amount||0),0);
  const car=k=>sortKey===k?`<span class="caret">${sortDir==="desc"?"&#9660;":"&#9650;"}</span>`:"";
  const body=rows.map(e=>`<tr${e.flags.length?' class="flagged"':""}><td class="num muted">${esc(e.date)}</td><td>${esc(e.vendor)}${e.flags.length?"<br>"+[...new Set(e.flags)].map(f=>`<span class="dtag">${f}</span>`).join(""):""}</td><td>${esc(e.category)}</td>
    <td class="note">${esc(e.notes)}</td><td class="r v num">${e.amount===null?'<span class="muted">&mdash;</span>':money(e.amount)}</td></tr>`).join("")
    ||'<tr><td colspan="5" class="muted" style="padding:18px 0">No expenses match these filters.</td></tr>';
  return `<div class="controls">
      <span><label for="fCat">Category</label><select id="fCat">${cats.map(c=>opt(c,fCat,c==="all"?"All categories":esc(c))).join("")}</select></span>
      <span><label for="fMonth">Month</label><select id="fMonth">${mons.map(m=>opt(m,fMonth,m==="all"?"All months":monthName(m))).join("")}</select></span>
      ${nFlag?`<span><label for="fFlag">Show</label><select id="fFlag">${opt("all",fFlag,"All rows")}${opt("any",fFlag,"Rows with data notes ("+nFlag+")")}${opt("dup",fFlag,"Possible duplicates")}${opt("No amount",fFlag,"No amount")}${opt("Open question",fFlag,"Open questions")}</select></span>`:""}
    </div>
    <div class="tscroll"><table><thead><tr>
      <th class="sortable" id="sDate">Date${car("date")}</th><th>Vendor</th><th>Category</th><th>Notes</th>
      <th class="r sortable" id="sAmt">Amount${car("amount")}</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td colspan="4">Total of ${rows.length} shown expense${rows.length===1?"":"s"}</td><td class="r num">${money(sum)}</td></tr></tfoot></table></div>`;
}

function render(){
  const d=D;
  const ld=d.meta.lastDate.split("-"), lastNice=MN[+ld[1]-1]+" "+(+ld[2])+", "+ld[0];
  document.getElementById("freshness").textContent="Data through "+monthName(d.curKey);
  document.getElementById("freshness").title="Latest expense in the file: "+lastNice;
  const lc=lineChart(d);
  const ovLegend=d.fastest?`<span><i class="${d.fastest.flag?"ov":"ovq"}"></i>${esc(d.fastest.cat)} only (fastest-growing), shaded</span>`:"";
  const iss=d.dq.issues;
  const dqHtml=iss.length?`<div class="dq" id="dq"><div class="dq-h"><span class="ibadge">i</span><div><b>Before relying on these numbers:</b> ${iss.length===1?"one thing":iss.length+" things"} in this data could change the totals.</div></div><ul>`+
    iss.map(x=>`<li><b>${esc(x.title)}.</b> ${x.text}${x.tag?`<button class="linkbtn" data-flag="${esc(x.tag)}">Show rows</button>`:""}</li>`).join("")+`</ul></div>`
    :`<div class="dq ok"><div class="dq-h"><span class="ibadge">i</span><div>No data problems found: every row has a readable date and amount, no repeated charges, no open questions in the notes.</div></div></div>`;
  document.getElementById("app").innerHTML=
    verdict(d)+dqHtml
    +`<section><div class="sec-h"><h2>Monthly spend trend</h2><span class="hint">Hover a month for exact figures</span></div>
      <div class="card"><div class="legend"><span><i></i>Total spend</span>${ovLegend}${Object.keys(d.dq.dupByMonth).some(k=>{const m=d.totals.find(x=>x.key===k);return d.dq.dupByMonth[k]>=0.03*m.total;})?'<span><i class="adj"></i>Total without possible duplicates</span>':""}${Object.keys(d.dq.mNotes).length?'<span><i class="dn"></i>Month has data notes</span>':""}</div>
      <div class="chart-box" id="cbox">${lc.svg}<div class="tip" id="tip"></div></div></div></section>`
    +`<section><div class="sec-h"><h2>Where the money goes</h2>
      <span class="toggle"><button id="bThis" class="${barMode==="this"?"on":""}">${monthName(d.curKey)}</button><button id="bAll" class="${barMode==="all"?"on":""}">All months</button></span></div>
      <div class="card">${barChart(barMode==="this"?d.catThis:d.catAll,barMode)}</div></section>`
    +`<section><div class="sec-h"><h2>All expenses</h2><span class="hint">Filter, then click Amount or Date to sort</span></div>
      <div class="card" id="tcard">${table(d)}</div></section>`
    +`<div class="fresh-line">Data through <b>${monthName(d.curKey)}</b> &middot; latest expense dated ${lastNice}</div>`
    +`<div class="foot"><span class="swatch"></span> Rust marks the wrong direction only: total spend going up, and any category up more than ${FLAG_PCT}% vs the prior month. The month-over-month tile turns green when spending falls.<br>
      <span class="ibadge" style="width:11px;height:11px;font-size:8px;vertical-align:0;margin:0 3px">i</span> Slate marks data notes: things that make a number less certain, not better or worse.<br>${d.meta.rows} rows read &middot; ${d.meta.counted} counted in totals &middot; ${d.months.length} months (${monthName(d.months[0])} &ndash; ${monthName(d.curKey)}).</div>`;
  wire(lc);
}
function wire(lc){
  const $=id=>document.getElementById(id);
  $("bThis").onclick=()=>{barMode="this";render();};
  $("bAll").onclick=()=>{barMode="all";render();};
  wireTable();
  document.querySelectorAll(".linkbtn[data-flag]").forEach(b=>b.onclick=()=>{fFlag=b.dataset.flag;fCat="all";fMonth="all";refresh();
    document.getElementById("tcard").scrollIntoView({behavior:"smooth",block:"start"});});
  // tooltip
  const svg=$("trend"),tip=$("tip"),hl=$("hline"),box=$("cbox");
  svg.querySelectorAll(".hz").forEach(r=>{
    r.addEventListener("mouseenter",()=>{
      const i=+r.dataset.i,m=D.totals[i],sc=svg.getBoundingClientRect().width/lc.W;
      let h=`<b>${monthName(m.key)}</b><br>Total: <b class="num">${money(m.total)}</b>`;
      if(D.fastest)h+=`<br>${esc(D.fastest.cat)}: <span class="num">${money(D.fastest.series[i].total)}</span>`;
      const dx=D.dq.dupByMonth[m.key];if(dx)h+=`<br>Without possible duplicates: <span class="num">${money(m.total-dx)}</span>`;
      if(D.dq.mNotes[m.key])h+=`<div style="margin-top:4px;opacity:.8;white-space:normal;max-width:260px">Data notes: ${esc(D.dq.mNotes[m.key].join("; "))}</div>`;
      tip.innerHTML=h;tip.style.left=(lc.X(i)*sc)+"px";tip.style.top=(lc.Y(m.total)*sc-6)+"px";tip.style.opacity=1;
      hl.setAttribute("x1",lc.X(i));hl.setAttribute("x2",lc.X(i));hl.setAttribute("opacity",1);
    });
  });
  svg.addEventListener("mouseleave",()=>{tip.style.opacity=0;hl.setAttribute("opacity",0);});
}
function wireTable(){
  const $=id=>document.getElementById(id);
  $("fCat").onchange=e=>{fCat=e.target.value;refresh();};
  $("fMonth").onchange=e=>{fMonth=e.target.value;refresh();};
  if($("fFlag"))$("fFlag").onchange=e=>{fFlag=e.target.value;refresh();};
  $("sAmt").onclick=()=>{if(sortKey==="amount")sortDir=sortDir==="desc"?"asc":"desc";else{sortKey="amount";sortDir="desc";}refresh();};
  $("sDate").onclick=()=>{if(sortKey==="date")sortDir=sortDir==="desc"?"asc":"desc";else{sortKey="date";sortDir="desc";}refresh();};
}
function refresh(){document.getElementById("tcard").innerHTML=table(D);wireTable();}

function load(text){
  const d=analyze(text);
  if(d.error){document.getElementById("app").innerHTML=`<div class="card err">${esc(d.error)}</div>`;return;}
  D=d;barMode="this";sortKey="amount";sortDir="desc";fCat="all";fMonth="all";fFlag="all";render();
}
try{load(document.getElementById("seed").textContent);}
catch(e){document.getElementById("app").innerHTML='<div class="card err">Could not load the built-in data.</div>';}
document.getElementById("reload").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>{const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>load(ev.target.result);r.readAsText(f);e.target.value="";};
document.getElementById("print").onclick=()=>window.print();
</script>
</body>
